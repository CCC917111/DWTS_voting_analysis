name: Synthetic tests
on:
  push:
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  tests:
    runs-on: ubuntu-latest
    env:
      MPLBACKEND: Agg
      MPLCONFIGDIR: /tmp/dwts-matplotlib
      NUMBA_CACHE_DIR: /tmp/dwts-numba
      PYTENSOR_FLAGS: base_compiledir=/tmp/dwts-pytensor
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
      - run: python -m pip install -r requirements-v4-verified.txt
      - run: python -m pip install --no-deps -e '.[test,audit]'
      - run: python -m pytest -q
      - run: python -m dwts.demo --out outputs/ci-demo
      - run: python -m dwts prospective demo --state outputs/ci-prospective-demo
